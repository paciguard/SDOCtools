name: Standalone Windows build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original references
        run: python tools/verify_sources.py
      - name: Publish standalone application
        shell: pwsh
        run: ./tools/build.ps1
      - name: Verify standalone package
        run: python tools/verify_project.py
      - name: Verify application startup
        shell: pwsh
        run: ./tests/startup.ps1
      - name: Verify embedded templates without external source files
        shell: pwsh
        run: ./tests/embedded-templates.ps1
      - name: Compile Excel editor regression tests
        shell: pwsh
        run: dotnet build tests/EditorLifecycleSmoke.csproj --configuration Release --disable-build-servers /p:UseSharedCompilation=false /nr:false /m:1
      - name: Verify stalled calculation workers return control
        shell: pwsh
        run: |
          dotnet build tests/CalculationProcessSmoke/CalculationProcessSmoke.csproj -c Release --disable-build-servers /p:UseSharedCompilation=false /nr:false /m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/CalculationProcessSmoke/bin/Release/net8.0-windows/CalculationProcessSmoke.exe
      - name: Verify mobile calculation cancellation and completion
        shell: pwsh
        run: |
          dotnet build tests/OfflineCalculationSmoke/OfflineCalculationSmoke.csproj -c Release --disable-build-servers /p:RestorePackagesPath="$pwd/.tools/nuget" /p:UseSharedCompilation=false /nr:false /m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/OfflineCalculationSmoke/bin/Release/net8.0/OfflineCalculationSmoke.exe
      - name: Verify offline mobile calculations and DWG/PDF output without Excel
        shell: pwsh
        run: |
          dotnet build tests/OfflineSmoke/OfflineSmoke.csproj -c Release --disable-build-servers /p:RestorePackagesPath="$pwd/.tools/nuget" /p:UseSharedCompilation=false /nr:false /m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/OfflineSmoke/bin/Release/net8.0/OfflineSmoke.exe tests/offline-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install olefile
          python tools/verify_mobile_workbook.py
      - uses: actions/upload-artifact@v4
        with:
          name: CFL-SubmitTools-Windows
          path: dist/CFL-SubmitTools
