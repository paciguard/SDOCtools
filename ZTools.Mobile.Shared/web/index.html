<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>凯乐提交工具</title><link rel="stylesheet" href="mobile.css?v=1.4"></head>
<body><header><img src="cfl-logo.jpg" alt="凯乐 CFL"><div><h1>凯乐提交工具</h1><p>输入参数 · 计算 · 提交图纸</p></div><span>离线可用</span></header>
<main><section><h2>项目管理</h2><div class="actions"><button id="new">新建项目</button><button id="open">打开项目</button><button id="import">导入 Excel</button></div><p id="project">请选择或新建项目</p><div class="actions"><button data-form="project" data-job>项目设置</button><button id="excel" data-job>导出 Excel</button></div></section>
<section id="equipment"><h2>设备与参数</h2><label>当前设备<select id="device" data-job></select></label><div class="actions"><button id="add" data-job>添加设备</button><button id="remove" data-job>删除当前设备</button></div><div class="actions"><button data-form="equipment" data-job>设备参数</button><button data-form="motor" data-job>电机与底座</button><button data-form="pid" data-job>管仪参数</button><button data-form="materials" data-job>剖面材料</button><button data-form="utility" data-job>公用工程参数</button></div><div class="actions"><button id="calculate" class="primary" data-job>计算项目数据</button><button id="utility" data-job>计算公用工程</button></div><p id="calculation">导出的 Excel 为 .xlsx 格式，仅含 input；剖面、管仪和公用工程参数由应用管理并随项目保存。</p></section>
<section><h2>图纸输出</h2><div id="rows"></div><div class="checks"><label><input type="checkbox" value="GA" checked>总装外形图</label><label><input type="checkbox" value="PID" checked>管路仪表图</label><label><input type="checkbox" value="SEC" checked>剖面及明细</label></div><div class="actions"><button id="print" data-job>打印设置</button><button id="generate" class="primary" data-job>生成 DWG＋PDF</button></div><p>图纸与 Excel 保存在本机，可通过“导出”保存到文件。</p></section>
<section><div class="section-title"><h2>图纸预览</h2><button id="fit">适合窗口</button></div><div id="viewport"><p id="empty">完成计算并生成图纸后，在此预览。</p><small id="canvasNote" hidden>拖动平移 · 双指缩放</small></div><div id="files"></div></section>
<details><summary>操作记录</summary><pre id="log"></pre></details></main>
<dialog id="dialog"><form id="form"><div class="dialog-title"><h2 id="dialogTitle"></h2><button type="button" id="cancel">关闭</button></div><div id="fields"></div><p id="formError" role="alert"></p><footer><button type="submit" class="primary">保存参数</button></footer></form></dialog>
<dialog id="creationComplete" class="completion-dialog" aria-labelledby="creationCompleteTitle" aria-describedby="creationSummary"><div class="dialog-title"><img src="cfl-logo.jpg" alt="凯乐 CFL" width="44" height="44"><h2 id="creationCompleteTitle">图纸生成完成</h2></div><p id="creationSummary" class="creation-summary"></p><form method="dialog"><footer><button class="primary" autofocus>确定</button></footer></form></dialog>
<p id="message" role="alert" hidden></p><div id="busy" role="status" hidden><span></span><strong id="busyText">正在处理，请稍候…</strong><button id="cancelCalculation" hidden>取消计算</button></div><script type="module" src="mobile.js?v=1.4"></script></body></html>
